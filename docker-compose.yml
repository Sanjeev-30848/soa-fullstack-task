services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: exam_2400030848
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net

  backend:
    image: docker-backend-2400030848:latest
    container_name: backend-container
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:5432/exam_2400030848
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=root
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - app-net

  frontend:
    image: docker-frontend-2400030848:latest
    container_name: frontend-container
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge